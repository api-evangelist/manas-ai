name: Manas AI
description: >-
  Manas AI is an artificial-intelligence drug-discovery company co-founded by
  Reid Hoffman and physician-scientist Siddhartha Mukherjee, launched in late
  2024 and backed by General Catalyst and Greylock. The company applies machine
  learning and computational biology to accelerate the discovery and design of
  new medicines, with an initial focus on hard-to-treat cancers such as breast
  and prostate cancer and lymphoma. Manas AI operates as a private biotech /
  therapeutics research organization rather than a developer-facing platform:
  as of this profile it publishes no public API, developer portal, SDKs, or
  technical documentation. This entry is maintained in the API Evangelist
  network as a company profile surfaced from the General Catalyst portfolio.
